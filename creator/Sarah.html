<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sarah | MIRAGE Profile</title>
    <script src="https://unpkg.com/@trustwallet/wallet-core@latest/dist/lib/wallet-core.js"></script>
    <style>
        :root {
            --bg: #050508;
            --card: #0f0f15;
            --accent: #7b2ffb; /* Purple for Sarah */
            --text: #ffffff;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: var(--card);
            border: 1px solid #1c1c2b;
            padding: 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        .avatar {
            width: 80px;
            height: 80px;
            background: var(--accent);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
        }
        .username { color: var(--accent); font-weight: 600; margin-bottom: 20px; display: block; }
        .wallet-display {
            background: #000;
            border: 1px solid #222;
            padding: 15px;
            border-radius: 12px;
            font-size: 0.75rem;
            word-break: break-all;
            text-align: left;
            margin-bottom: 20px;
        }
        button {
            background: var(--text);
            color: #000;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="avatar">S</div>
        <h1>Sarah Smith</h1>
        <span class="username">@sarah_mirage</span>
        
        <p>Blockchain Architect & Crypto Designer.</p>

        <div class="wallet-display" id="wallet-info">
            Wallet status: Offline
        </div>

        <button onclick="initSarahWallet()">GENERATE SARAH'S WALLET</button>

        <div class="footer" style="margin-top:20px; font-size: 0.7rem; color: #444;">MIRAGE PROTOCOL SECURED</div>
    </div>

    <script>
        async function initSarahWallet() {
            const display = document.getElementById('wallet-info');
            display.innerText = "Generating Sarah's secure keys...";
            try {
                const core = await WalletCore.init();
                const wallet = core.HDWallet.create(12, "");
                const address = wallet.getAddressForCoin(core.CoinType.ethereum);
                display.innerHTML = `<strong>MNEMONIC:</strong><br>${wallet.mnemonic()}<br><br><strong>ETH:</strong><br>${address}`;
            } catch (e) { display.innerText = "Error: Protocol failed."; }
        }
    </script>
</body>
</html>
