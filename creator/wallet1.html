<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIRAGE | Foundation of Innovation</title>
    
    <!-- 1. The "Injected Brains" (Official UMD Bundles) -->
    <script src="https://cdn.jsdelivr.net/npm/tonweb@0.0.66/dist/tonweb.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tonweb-mnemonic@1.0.1/dist/web/index.min.js"></script>

    <style>
        :root { --bg: #0c0d10; --primary: #0098ea; --card: #16191e; --text: #ffffff; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { background: var(--card); border: 1px solid #2d3139; padding: 40px; border-radius: 30px; width: 380px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); text-align: center; }
        h1 { font-size: 28px; font-weight: 900; letter-spacing: 4px; margin-bottom: 5px; color: var(--primary); }
        .branding { font-size: 11px; color: #8e949a; margin-bottom: 30px; text-transform: uppercase; }
        .red-line { text-decoration: line-through; text-decoration-color: #ff3b30; text-decoration-thickness: 2px; }
        
        .action-box { margin-top: 20px; }
        textarea { width: 100%; height: 100px; background: #000; border: 1px solid #333; color: #4ade80; border-radius: 15px; padding: 15px; font-family: monospace; font-size: 13px; outline: none; box-sizing: border-box; margin-bottom: 15px; }
        
        button { width: 100%; padding: 16px; border-radius: 15px; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; margin-bottom: 10px; font-size: 14px; }
        .btn-create { background: #2d3139; color: white; }
        .btn-sync { background: var(--primary); color: white; }
        button:hover { transform: translateY(-2px); opacity: 0.9; }

        .result-area { display: none; margin-top: 25px; text-align: left; background: #0000004d; padding: 20px; border-radius: 15px; border: 1px dashed #444; }
        .label { font-size: 10px; color: var(--primary); font-weight: bold; margin-bottom: 5px; display: block; }
        .address-text { font-family: monospace; font-size: 11px; color: #d1d5db; word-break: break-all; line-height: 1.4; }
    </style>
</head>
<body>

    <div class="card">
        <h1>MIRAGE</h1>
        <div class="branding">The <span class="red-line">IM</span>POSSIBLE Core</div>

        <div class="action-box">
            <button class="btn-create" onclick="createNewWallet()">CREATE NEW 24-WORD SEED</button>
            <div style="margin: 15px 0; font-size: 12px; color: #555;">— OR —</div>
            <textarea id="seedInput" placeholder="Paste your 24 words here..."></textarea>
            <button class="btn-sync" onclick="syncWallet()">SYNC TO BLOCKCHAIN</button>
        </div>

        <div id="result" class="result-area">
            <span class="label">V4R2 WALLET ADDRESS (MAINNET)</span>
            <div id="addressDisplay" class="address-text"></div>
            <p style="font-size: 9px; color: #666; margin-top: 15px;">Note: This address acts as your MIRAGE No-Auth Identity.</p>
        </div>
    </div>

    <script>
        // Use TonWeb from the CDN
        const tonweb = new window.TonWeb();
        const mnemonicHelper = window.TonWeb.mnemonic;

        async function createNewWallet() {
            try {
                // Generate 24 random words
                const mnemonic = await mnemonicHelper.generateMnemonic();
                document.getElementById('seedInput').value = mnemonic.join(' ');
                alert("New Seed Phrase Created! Copy it and keep it safe.");
            } catch (e) {
                console.error(e);
                alert("Error generating seed.");
            }
        }

        async function syncWallet() {
            const input = document.getElementById('seedInput').value.trim().toLowerCase();
            const words = input.split(/\s+/);

            if (words.length !== 24) {
                alert("Please enter exactly 24 words.");
                return;
            }

            try {
                // 1. Convert words to KeyPair
                const keyPair = await mnemonicHelper.mnemonicToKeyPair(words);
                
                // 2. Create Wallet Object (V4R2 is the current global standard)
                const WalletClass = tonweb.wallet.all['v4R2'];
                const wallet = new WalletClass(tonweb.provider, {
                    publicKey: keyPair.publicKey,
                    wc: 0
                });

                // 3. Get the Address
                const address = await wallet.getAddress();
                const friendlyAddress = address.toString(true, true, false); // non-bounceable

                // 4. Show Result
                document.getElementById('addressDisplay').innerText = friendlyAddress;
                document.getElementById('result').style.display = 'block';
                
            } catch (e) {
                console.error(e);
                alert("Invalid Seed Phrase. Please check your words.");
            }
        }
    </script>
</body>
</html>
