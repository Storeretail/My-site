<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIRAGE | Multi-Chain Vault</title>
    <script src="https://unpkg.com/@trustwallet/wallet-core@latest/dist/lib/wallet-core.js"></script>
    <style>
        :root { --bg: #000; --accent: #3b82f6; --card: #111; --border: #222; --text-dim: #888; }
        body { background: var(--bg); color: white; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 20px; display: flex; justify-content: center; }
        
        .wallet-app { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--border); border-radius: 32px; padding: 25px; position: relative; overflow: hidden; min-height: 600px; }
        
        /* Download Bar */
        .loading-screen { position: absolute; inset: 0; background: #000; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; text-align: center; }
        .progress-container { width: 100%; height: 6px; background: #222; border-radius: 10px; margin-top: 20px; overflow: hidden; }
        .progress-fill { width: 0%; height: 100%; background: var(--accent); transition: width 0.3s; }

        /* Main UI */
        .tab-section { margin-top: 20px; }
        .asset-card { background: #1a1a1a; border-radius: 20px; padding: 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 15px; border: 1px solid transparent; }
        .asset-card:hover { border-color: #333; }
        .coin-icon { width: 40px; height: 40px; border-radius: 50%; background: #222; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.7rem; }
        .coin-meta { flex: 1; }
        .coin-name { font-weight: 600; font-size: 1rem; }
        .coin-addr { font-size: 0.7rem; color: var(--text-dim); font-family: monospace; }
        .coin-bal { text-align: right; font-weight: bold; }

        /* Actions */
        .action-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 30px; }
        .btn { padding: 14px; border-radius: 14px; border: none; font-weight: bold; cursor: pointer; font-size: 0.9rem; transition: 0.2s; }
        .btn-blue { background: var(--accent); color: white; }
        .btn-dark { background: #222; color: white; }
        
        textarea { width: 100%; background: #000; border: 1px solid #333; color: #ffcc00; border-radius: 12px; padding: 12px; box-sizing: border-box; font-family: monospace; margin-top: 10px; display: none;}
        
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="wallet-app">
    <div id="loader" class="loading-screen">
        <h2 style="letter-spacing: 4px; margin: 0;">MIRAGE</h2>
        <p style="color: var(--text-dim); font-size: 0.8rem;">Downloading Crypto Core...</p>
        <div class="progress-container">
            <div id="bar" class="progress-fill"></div>
        </div>
        <p id="percent" style="font-size: 0.7rem; margin-top: 10px;">0%</p>
    </div>

    <div id="main-ui" class="hidden">
        <div style="text-align: center; margin-bottom: 20px;">
            <p style="color: var(--text-dim); font-size: 0.8rem;">Total Balance</p>
            <h1 id="total-balance">$0.00</h1>
        </div>

        <div class="action-btns">
            <button class="btn btn-blue" onclick="showCreate()">CREATE</button>
            <button class="btn btn-dark" onclick="showImport()">IMPORT</button>
        </div>

        <div id="import-area" class="hidden">
            <textarea id="import-input" rows="3" placeholder="Enter your 12-word seed phrase..."></textarea>
            <button class="btn btn-blue" style="margin-top:10px; width:100%" onclick="processImport()">RESTORE</button>
        </div>

        <div class="tab-section">
            <div class="asset-card">
                <div class="coin-icon" style="border: 1px solid #0088cc;">TON</div>
                <div class="coin-meta">
                    <div class="coin-name">TON</div>
                    <div id="addr-ton" class="coin-addr">---</div>
                </div>
                <div class="coin-bal" id="bal-ton">0.00</div>
            </div>

            <div class="asset-card">
                <div class="coin-icon" style="border: 1px solid #627eea;">ETH</div>
                <div class="coin-meta">
                    <div class="coin-name">Ethereum</div>
                    <div id="addr-eth" class="coin-addr">---</div>
                </div>
                <div class="coin-bal">0.00</div>
            </div>

            <div class="asset-card">
                <div class="coin-icon" style="border: 1px solid #f7931a;">BTC</div>
                <div class="coin-meta">
                    <div class="coin-name">Bitcoin</div>
                    <div id="addr-btc" class="coin-addr">---</div>
                </div>
                <div class="coin-bal">0.00</div>
            </div>
        </div>

        <div id="seed-display" class="hidden" style="margin-top:20px; padding:15px; background: #1a1500; border: 1px dashed #555; border-radius: 15px;">
            <small style="color:#ffcc00">NEW SEED PHRASE GENERATED:</small>
            <div id="seed-text" style="font-family: monospace; margin-top:10px; font-size: 0.85rem; color: #ffcc00;"></div>
        </div>
    </div>
</div>

<script>
    let core;

    // 1. SIMULATE DOWNLOAD PROGRESS (The library loads as a WASM blob)
    async function initEngine() {
        const bar = document.getElementById('bar');
        const percent = document.getElementById('percent');
        
        // Progress Simulation for the 2MB+ download
        let progress = 0;
        const interval = setInterval(() => {
            progress += Math.random() * 15;
            if (progress >= 95) clearInterval(interval);
            bar.style.width = progress + "%";
            percent.innerText = Math.floor(progress) + "%";
        }, 100);

        try {
            core = await WalletCore.init();
            clearInterval(interval);
            bar.style.width = "100%";
            percent.innerText = "100%";
            
            setTimeout(() => {
                document.getElementById('loader').classList.add('hidden');
                document.getElementById('main-ui').classList.remove('hidden');
            }, 500);
        } catch (e) {
            alert("Download failed. Check your internet.");
        }
    }

    // 2. WALLET LOGIC
    function updateUI(wallet) {
        const ton = wallet.getAddressForCoin(core.CoinType.ton);
        const eth = wallet.getAddressForCoin(core.CoinType.ethereum);
        const btc = wallet.getAddressForCoin(core.CoinType.bitcoin);

        document.getElementById('addr-ton').innerText = ton.slice(0,8) + "..." + ton.slice(-8);
        document.getElementById('addr-eth').innerText = eth.slice(0,8) + "..." + eth.slice(-8);
        document.getElementById('addr-btc').innerText = btc.slice(0,8) + "..." + btc.slice(-8);
        
        fetchBalance(ton);
    }

    function showCreate() {
        const wallet = core.HDWallet.create(12, "");
        document.getElementById('seed-text').innerText = wallet.mnemonic();
        document.getElementById('seed-display').classList.remove('hidden');
        document.getElementById('import-area').classList.add('hidden');
        updateUI(wallet);
    }

    function showImport() {
        document.getElementById('import-area').classList.remove('hidden');
        document.getElementById('seed-display').classList.add('hidden');
        document.getElementById('import-input').style.display = 'block';
    }

    function processImport() {
        const mnemonic = document.getElementById('import-input').value.trim();
        if (core.Mnemonic.isValid(mnemonic)) {
            const wallet = core.HDWallet.createWithMnemonic(mnemonic, "");
            updateUI(wallet);
            alert("Wallet Imported!");
        } else {
            alert("Invalid Seed Phrase!");
        }
    }

    async function fetchBalance(addr) {
        try {
            const res = await fetch(`https://toncenter.com/api/v2/getAddressInformation?address=${addr}`);
            const data = await res.json();
            if(data.ok) {
                document.getElementById('bal-ton').innerText = (data.result.balance / 1e9).toFixed(2);
            }
        } catch(e) {}
    }

    initEngine();
</script>

</body>
</html>
