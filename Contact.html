<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <style>
        body { margin: 0; background: #6366f1; color: white; font-family: sans-serif; display: flex; flex-direction: column; min-height: 100vh; }
        nav { padding: 20px; text-align: center; background: rgba(0,0,0,0.1); }
        nav a { color: white; margin: 0 15px; text-decoration: none; font-weight: bold; }
        .form-container { width: 90%; max-width: 400px; margin: auto; background: white; color: #333; padding: 30px; border-radius: 15px; }
        input, textarea { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        button { background: #6366f1; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <nav>
        <a href="/">Home</a>
        <a href="/profile">Profile</a>
        <a href="/crypto">Crypto</a>
        <a href="/contact">Contact</a>
    </nav>
    <div class="form-container">
        <h2>Contact Me</h2>
        <p>Have a question about Mirage?</p>
        <input type="text" placeholder="Your Name">
        <input type="email" placeholder="Your Email">
        <textarea placeholder="Your Message" rows="4"></textarea>
        <button type="submit">Send Message</button>
    </div>
</body>
</html>
