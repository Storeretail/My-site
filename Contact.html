<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get In Touch</title>
    <style>
        body { margin: 0; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; align-items: center; }
        nav { padding: 20px; }
        nav a { color: white; margin: 0 10px; text-decoration: underline; }
        .form-box { background: rgba(255, 255, 255, 0.1); padding: 30px; border-radius: 15px; backdrop-filter: blur(10px); width: 300px; margin-top: 50px;}
        input { width: 100%; margin-bottom: 10px; padding: 8px; border-radius: 5px; border: none; }
        button { width: 100%; padding: 10px; background: #00d2ff; border: none; color: white; cursor: pointer; border-radius: 5px; }
    </style>
</head>
<body>
    <nav>
        <a href="/">Home</a>
        <a href="/profile">Profile</a>
        <a href="/crypto">Crypto</a>
        <a href="/contact">Contact</a>
    </nav>
    <div class="form-box">
        <h3>Message Me</h3>
        <input type="text" placeholder="Name">
        <input type="email" placeholder="Email">
        <button>Send Message</button>
    </div>
</body>
</html>
