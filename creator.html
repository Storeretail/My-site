<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIRAGE | Creator Hub</title>
    <style>
        :root {
            --bg: #000000;
            --card: #0a0a0a;
            --accent: #ff0000;
            --text: #ffffff;
            --muted: #666666;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            max-width: 1000px;
            text-align: center;
            margin-bottom: 50px;
        }
        h1 {
            font-size: 3rem;
            margin: 0;
            letter-spacing: -2px;
        }
        .creator-grid {
            width: 100%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .creator-card {
            background: var(--card);
            border: 1px solid #1a1a1a;
            padding: 40px;
            border-radius: 24px;
            text-decoration: none;
            color: white;
            transition: 0.3s ease;
            text-align: center;
        }
        .creator-card:hover {
            border-color: var(--accent);
            background: #0f0f0f;
            transform: translateY(-5px);
        }
        .avatar-circle {
            width: 60px;
            height: 60px;
            background: #222;
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            border: 1px solid #333;
        }
        .creator-name {
            font-size: 1.5rem;
            font-weight: 800;
            display: block;
            margin-bottom: 5px;
        }
        .btn-view {
            margin-top: 20px;
            display: inline-block;
            background: var(--accent);
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: bold;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>MIRAGE DIRECTORY</h1>
        <p style="color: var(--muted)">Select a creator profile to view their secure wallet.</p>
    </div>

    <div class="creator-grid">
        
        <a href="/creator/john" class="creator-card">
            <div class="avatar-circle">J</div>
            <span class="creator-name">John Doe</span>
            <span style="color: var(--accent); font-size: 0.8rem;">@john_mirage</span>
            <br>
            <div class="btn-view">OPEN PROFILE</div>
        </a>

        <div class="creator-card" style="opacity: 0.2; border-style: dashed;">
            <div class="avatar-circle">?</div>
            <span class="creator-name">Available</span>
            <span>Join the protocol</span>
        </div>

    </div>

</body>
</html>
